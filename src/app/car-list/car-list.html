
<div>
    <input type="text" placeholder="Enter car name" [(ngModel)]="carName">
    <input type="date" placeholder="Enter car year" [(ngModel)]="carYear">
    <button (click)="onSubmit()">Add Car</button>
</div>

<ul>
    @for(car of cars; track car.id){
        <li>{{car.name | text:'uppercase'}} | {{car.year}}
            <button (click)="onDelete(car)">Delete</button>
        </li>
    }
</ul>

<h1>Purchased from {{company | text:'lowercase'}} on {{purchasedOn | date:"d MMM y"}}</h1>
<p>Total: {{amount | currency:"EUR"}}</p>
